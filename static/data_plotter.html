<!doctype html>
<html>
<head>
  <script src={{ static_url("js/jquery.min.js") }}></script>
  <script src={{ static_url("js/chart.umd.min.js") }}></script>
  <script src={{ static_url("js/cdn.min.js") }}></script>
  <script src={{ static_url("js/chartjs-adapter-date-fns.min.js") }}></script>
</head>
<body>
<div>
  <canvas id="temperature_plot"></canvas>
</div>
<button id="plot">PLOT</button>
<script>
  $('#plot').on('click', function() {
    plotData(['upstairs_bme688_temperature','upstairs_hdc302x_temperature']);
  });

  const chartAreaBorder = {
    id: 'chartAreaBorder',
    beforeDraw(chart, args, options) {
      const {ctx, chartArea: {left, top, width, height}} = chart;
      ctx.save();
      ctx.strokeStyle = options.borderColor;
      ctx.lineWidth = options.borderWidth;
      ctx.setLineDash(options.borderDash || []);
      ctx.lineDashOffset = options.borderDashOffset;
      ctx.strokeRect(left, top, width, height);
      ctx.restore();
    }
  };

  const temperature_plot = new Chart($("#temperature_plot"), {
    type: 'line',
    data: {
      datasets: [],
    },
    options: {
      scales: {
        x: {
          type: 'time',
        }
      },
      plugins: {
        chartAreaBorder: {
          borderColor: 'black',
          borderWidth: 3,
        }
      }
    },
    plugins: [chartAreaBorder]
  })

  async function getData(sensor) {
    const data = [];
    const resp = await $.ajax({
      url: "/",
      type: "POST",
      dataType: "text",
      data: sensor,
    })
    //console.log(resp);
    const table = resp.trim().split('\n').map(row => row.split(',').map(field => field.trim()));
    //console.log(table)
    table.forEach(row => {
      x = row[0];
      y = parseFloat(row[1]);
      //console.log(x, y);
      data.push([x,y])
    });
    return data;
  }

  async function plotData(sensors) {
    for (const sensor of sensors) {
      const data = await getData(sensor);
      temperature_plot.data.datasets.push(
        {
          label: sensor,
          data: data,
          pointStyle: false,
        }
      );
    }
    temperature_plot.update();
  }
</script>
</body>
</html>
