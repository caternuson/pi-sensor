<!doctype html>
<html>
<head>
  <script src={{ static_url("js/jquery.min.js") }}></script>
  <script src={{ static_url("js/chart.umd.min.js") }}></script>
  <script src={{ static_url("js/cdn.min.js") }}></script>
  <script src={{ static_url("js/chartjs-adapter-date-fns.min.js") }}></script>
</head>
<body>
<center>
<h1>Daily Plots</h1>
<div>
<button id="prev_day">PREV</button>
<button id="today">TODAY</button>
<button id="next_day">NEXT</button>
</div>
<div id="date">DATE</div>
<div style="position: relative; width:80vw; height:50vh">
  <canvas id="temperature_plot"></canvas>
</div>
<div style="position: relative; width:80vw; height:50vh">
  <canvas id="humidity_plot"></canvas>
</div>
</center>
</body>
<script>
  const plotDate = new Date();

  $( document ).ready( function() {
    updatePlots(plotDate);
  });

  $('#prev_day').on('click', function() {
    plotDate.setDate(plotDate.getDate() - 1);
    updatePlots(plotDate);
  });

  $('#today').on('click', function() {
    plotDate.setTime(Date.now());
    updatePlots(plotDate);
  });

  $('#next_day').on('click', function() {
    plotDate.setDate(plotDate.getDate() + 1);
    updatePlots(plotDate);
  });

  const chartAreaBorder = {
    id: 'chartAreaBorder',
    beforeDraw(chart, args, options) {
      const {ctx, chartArea: {left, top, width, height}} = chart;
      ctx.save();
      ctx.strokeStyle = options.borderColor;
      ctx.lineWidth = options.borderWidth;
      ctx.setLineDash(options.borderDash || []);
      ctx.lineDashOffset = options.borderDashOffset;
      ctx.strokeRect(left, top, width, height);
      ctx.restore();
    }
  };

  const temperature_plot = new Chart($("#temperature_plot"), {
    type: 'line',
    data: {
      datasets: [],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          type: 'time',
        },
        y: {
          title: {
            text: 'Temperature (°C)',
            display: true,
            font: {
              size: 16
            }
          }
        }
      },
      plugins: {
        chartAreaBorder: {
          borderColor: 'black',
          borderWidth: 3,
        }
      }
    },
    plugins: [chartAreaBorder]
  })

  const humidity_plot = new Chart($("#humidity_plot"), {
    type: 'line',
    data: {
      datasets: [],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          type: 'time',
        },
        y: {
          title: {
            text: 'Relative Humidity (%)',
            display: true,
            font: {
              size: 16
            }
          }
        }
      },
      plugins: {
        chartAreaBorder: {
          borderColor: 'black',
          borderWidth: 3,
        }
      }
    },
    plugins: [chartAreaBorder]
  })

  async function getData(sensor, date) {
    data_request = {
      sensor: sensor,
      date: date
    }
    return await $.ajax({
      url: "/",
      type: "POST",
      dataType: "json",
      data: JSON.stringify(data_request)
    })
  }

  async function updatePlots(date) {
    const day = date.toISOString().split('T')[0]

    $('#date').text(day);

    temperature_plot.data.datasets= [];
    sensors = ['upstairs_bme688_temperature','upstairs_hdc302x_temperature']
    for (const sensor of sensors) {
      si = sensor.indexOf('_temperature')
      const data = await getData(sensor, day);
      temperature_plot.data.datasets.push(
        {
          label: sensor.slice(0,si),
          data: data,
          pointStyle: false,
        }
      );
    }
    temperature_plot.update();

    humidity_plot.data.datasets= [];
    sensors = ['upstairs_bme688_relative_humidity','upstairs_hdc302x_relative_humidity']
    for (const sensor of sensors) {
      si = sensor.indexOf('_relative_humidity')
      const data = await getData(sensor, day);
      humidity_plot.data.datasets.push(
        {
          label: sensor.slice(0,si),
          data: data,
          pointStyle: false,
        }
      );
    }
    humidity_plot.update();
  }

</script>
</body>
</html>
