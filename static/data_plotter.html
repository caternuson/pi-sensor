<!doctype html>
<html>
<head>
  <script src={{ static_url("js/jquery.min.js") }}></script>
  <script src={{ static_url("js/chart.umd.min.js") }}></script>
  <script src={{ static_url("js/cdn.min.js") }}></script>
  <script src={{ static_url("js/chartjs-adapter-date-fns.min.js") }}></script>
</head>
<body style="background-color: #eeeeee">
<center>
<h1>Daily Plots</h1>
<div>
<button id="prev_day">PREV</button>
<button id="today">TODAY</button>
<button id="next_day">NEXT</button>
</div>
<div id="date">DATE</div>
<div style="position: relative; width:80vw; height:30vh">
  <canvas id="chart1"></canvas>
</div>
<div style="position: relative; width:80vw; height:30vh">
  <canvas id="chart2"></canvas>
</div>
<div style="position: relative; width:80vw; height:30vh">
  <canvas id="chart3"></canvas>
</div>
</center>
</body>
<script>
  function today() {
    return Date.now() - new Date().getTimezoneOffset() * 60000;
  }

  const plotDate = new Date(today());

  $( document ).ready( function() {
    updatePlots(plotDate);
  });

  $('#prev_day').on('click', function() {
    plotDate.setDate(plotDate.getDate() - 1);
    updatePlots(plotDate);
  });

  $('#today').on('click', function() {
    plotDate.setTime(today());
    updatePlots(plotDate);
  });

  $('#next_day').on('click', function() {
    plotDate.setDate(plotDate.getDate() + 1);
    updatePlots(plotDate);
  });

  const chartArea = {
    id: 'chartArea',
    beforeDraw(chart, args, options) {
      const {ctx, chartArea: {left, top, width, height}} = chart;
      ctx.save();
      ctx.fillStyle = options.backgroundColor;
      ctx.fillRect(left, top, width, height);
      ctx.strokeStyle = options.borderColor;
      ctx.lineWidth = options.borderWidth;
      ctx.strokeRect(left, top, width, height);
      ctx.restore();
    }
  };

  Chart.register(chartArea);
  Chart.defaults.responsive = true
  Chart.defaults.maintainAspectRatio = false
  Chart.defaults.plugins.chartArea.borderColor = 'black'
  Chart.defaults.plugins.chartArea.borderWidth = 3
  Chart.defaults.plugins.chartArea.backgroundColor = 'white'
  Chart.defaults.datasets.line.pointStyle = false

  const chart_config = [
    {
      chart: makeChart($("#chart1"), 'Temperature (°C)'),
      sensors: ['upstairs_bme688_temperature','downstairs_bme680_temperature', 'outside_ds18b20_temperature']
    },
    {
      chart: makeChart($("#chart2"), 'Relative Humidity (%)'),
      sensors: ['upstairs_bme688_relative_humidity','downstairs_bme680_relative_humidity']
    },
    {
      chart: makeChart($("#chart3"), 'Pressure (hPa)'),
      sensors: ['upstairs_bme688_pressure','downstairs_bme680_pressure']
    }
  ]

function makeChart(ctx, title) {
    return new Chart($(ctx), {
      type: 'line',
      data: {
        datasets: [],
      },
      options: {
        scales: {
          x: {
            type: 'time',
          },
          y: {
            title: {
              text: title,
              display: true,
              font: {
                size: 16
              }
            }
          }
        }
      }
    })
  }

  async function updatePlots(date) {
    const day = date.toISOString().split('T')[0]

    $('#date').text(day);

    for (const chart of chart_config) {
      updatePlot(chart.chart, chart.sensors, day)
    }
  }

  async function updatePlot(plot, sensors, day) {
    plot.data.datasets = [];
    for (const sensor of sensors) {
      const data = await getData(sensor, day);
      plot.data.datasets.push(
        {
          label: sensor,
          data: data,
        }
      );
    }
    plot.update();
  }

  async function getData(sensor, date) {
    return await $.ajax({
      url: "/",
      type: "POST",
      dataType: "json",
      data: JSON.stringify({
        sensor: sensor,
        date: date
      })
    })
  }
</script>
</body>
</html>
